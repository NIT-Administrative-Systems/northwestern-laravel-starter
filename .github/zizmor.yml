# zizmor (GitHub Actions security auditor) configuration. CI fails on any unsuppressed finding.
# Docs: https://docs.zizmor.sh/
rules:
  unpinned-uses:
    config:
      policies:
        # Every action must be pinned to a full commit SHA (with a version comment for
        # readability). Mutable tag refs are rejected to prevent supply chain attacks.
        "*": hash-pin

  artipacked:
    # Deliberate: these two checkouts must persist git credentials because their jobs push.
    # Every other checkout in the repo sets `persist-credentials: false`.
    ignore:
      # The lint job commits automated formatting fixes back to the PR branch.
      - check-pr.yml:211
      # The release job commits the .starter-version.yaml bump and pushes it to main.
      - release.yml:29

  self-repository:
    # zizmor 1.30 recommends GitHub's `$/` self-repository syntax for local actions, but actionlint 1.7.12
    # rejects it as a missing ref (rhysd/actionlint#711). Re-enable once actionlint accepts `$/`.
    disable: true
