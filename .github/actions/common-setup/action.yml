$schema: "https://json.schemastore.org/github-action"
name: "Common Setup"
description: "Runs common setup steps for caching, installing dependencies, and preparing the environment"
inputs:
  php-version:
    description: "The PHP version to use"
    required: false
    default: "8.5"
  coverage:
    description: "Coverage driver for setup-php (none|pcov|xdebug)"
    required: false
    default: "none"
  tools:
    description: "Comma-separated tools for setup-php (e.g. phpunit/phpcov)"
    required: false
    default: ""
  node-version:
    description: "Node.js version"
    required: false
    default: "26"
  pnpm-version:
    description: "pnpm version"
    required: false
    default: "12.x.x"
  docs-only:
    description: "If true, only run Node/pnpm steps and optional docs build (true|false)"
    required: false
    default: "false"
  build-frontend-assets:
    description: "Whether to run pnpm build in the project root (true|false)"
    required: false
    default: "true"
  build-docs:
    description: "Whether to build the documentation site in ./docs (true|false)"
    required: false
    default: "false"
  php-only:
    description: "If true, skip all Node/pnpm steps (true|false)"
    required: false
    default: "false"
  install-playwright:
    description: "Whether to install Playwright's Chromium and its system libraries, for browser tests (true|false)"
    required: false
    default: "false"
  run-ide-helper:
    description: "Whether to run ide-helper commands during setup (true|false)"
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: 🐘 Setup PHP
      if: ${{ inputs.docs-only != 'true' }}
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: ${{ inputs['php-version'] }}
        coverage: ${{ inputs.coverage }}
        tools: ${{ inputs.tools }}
        extensions: >-
          ctype, curl, dom, fileinfo, filter, hash, iconv, intl, json, libxml,
          mbstring, openssl, pcre, pdo, pdo_pgsql, phar, reflection, session,
          simplexml, sodium, tokenizer, xml, xmlreader, xmlwriter, zip
        ini-values: memory_limit=-1

    - name: 📦 Setup pnpm
      if: ${{ inputs['php-only'] != 'true' }}
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        version: ${{ inputs['pnpm-version'] }}

    - name: 🟢 Setup Node.js
      if: ${{ inputs['php-only'] != 'true' }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs['node-version'] }}
        cache: pnpm

    - name: 📷 pnpm Dependencies Cache
      if: ${{ inputs.docs-only != 'true' && inputs['php-only'] != 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: 💾 Install pnpm Dependencies
      if: ${{ inputs.docs-only != 'true' && inputs['php-only'] != 'true' }}
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline

    # Playwright recommends downloading browsers on each run: restoring a cache takes as long, and
    # the system libraries --with-deps installs can't be cached.
    - name: 🎭 Install Playwright Chromium
      if: ${{ inputs['install-playwright'] == 'true' }}
      shell: bash
      run: pnpm exec playwright install --with-deps chromium

    - name: 📷 Composer Dependencies Cache
      if: ${{ inputs.docs-only != 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: vendor
        key: ${{ runner.os }}-vendor-${{ hashFiles('composer.lock') }}

    - name: 💾 Install Composer Dependencies
      if: ${{ inputs.docs-only != 'true' }}
      shell: bash
      run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

    - name: ⚙️ Prepare Application Environment
      if: ${{ inputs.docs-only != 'true' }}
      shell: bash
      run: |
        cp .env.ci .env
        php artisan key:generate
        php artisan passport:keys
        php artisan migrate --force

    - name: 🔧 Generate IDE Helper Files
      if: ${{ inputs.docs-only != 'true' && inputs['run-ide-helper'] == 'true' }}
      shell: bash
      run: |
        php artisan ide-helper:generate
        php artisan ide-helper:meta
        php artisan ide-helper:models --write --reset
        php artisan ide-helper:models -N

    - name: 🏗️ Build Frontend Assets
      if: ${{ inputs.docs-only != 'true' && inputs['php-only'] != 'true' && inputs['build-frontend-assets'] == 'true' }}
      shell: bash
      run: pnpm build

    - name: 📚 Install Docs Dependencies
      if: ${{ inputs['build-docs'] == 'true' }}
      shell: bash
      run: |
        cd docs
        pnpm install --frozen-lockfile --prefer-offline

    - name: 📚 Build Documentation
      if: ${{ inputs['build-docs'] == 'true' }}
      shell: bash
      run: |
        cd docs
        pnpm build
