name: Check PR

env:
  NODE_VERSION: '26'
  PNPM_VERSION: '12.x.x'
  PHP_VERSION: '8.5'
  S3_USERNAME: 's3admin'
  S3_PASSWORD: 's3secret'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main, v3 ]
  push:
    branches: [ main, v3 ]

jobs:
  determine-scope:
    name: 🎯 Determine Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
        contents: read
        pull-requests: read
    outputs:
      iac: ${{ steps.changes.outputs.iac }}
      docs: ${{ steps.changes.outputs.docs }}
      code: ${{ steps.changes.outputs.code }}
      workflows: ${{ steps.changes.outputs.workflows }}
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔎 Detect Changed Files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            iac:
              - 'iac/**'
            docs:
              - 'docs/**'
            workflows:
              - '.github/**'
            code:
              - '**'
              - '!iac/**'
              - '!docs/**'

  validate-docs:
    name: 📚 Validate Documentation
    needs: determine-scope
    if: needs.determine-scope.outputs.docs == 'true'
    runs-on: ubuntu-latest
    environment: ci-cd
    timeout-minutes: 5
    permissions:
        contents: read

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      # No `cache: pnpm` here: it caches the pnpm store keyed on the root lockfile. When the root
      # lockfile changes but docs/node_modules is restored below, install never creates the store
      # and setup-node's post step fails trying to save it.
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📷 pnpm Dependencies Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            docs/node_modules
          key: ${{ runner.os }}-pnpm-docs-${{ hashFiles('docs/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-docs-

      - name: 💾 Install pnpm Dependencies
        run: |
          cd docs/
          pnpm install --frozen-lockfile --prefer-offline

      - name: 🔧 Build Documentation
        run: |
          cd docs/
          pnpm build

  # Lints the workflows themselves: actionlint for correctness (expressions, needs/outputs
  # wiring, shellcheck on run blocks), zizmor for security posture (action pinning, credential
  # persistence, injection). Suppressions live in .github/zizmor.yml with rationale.
  lint-workflows:
    name: 🔬 Lint Workflows
    needs: determine-scope
    if: needs.determine-scope.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
        contents: read
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧹 actionlint
        run: |
          # The problem matcher turns actionlint's output into inline PR annotations.
          echo "::add-matcher::.github/actionlint-matcher.json"
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: 🛡️ zizmor Security Audit
        # --format github emits workflow commands, so findings annotate the workflow files.
        run: pipx run zizmor==1.30.1 --no-online-audits --no-progress --format github .github/workflows/ .github/actions/

