name: Check PR

# Define the targeted versions to be used throughout the workflow.
env:
  NODE_VERSION: '25'
  PNPM_VERSION: '10.x.x'
  PHP_VERSION: '8.4'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  determine-scope:
    name: 🎯 Determine Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      iac: ${{ steps.changes.outputs.iac }}
      docs: ${{ steps.changes.outputs.docs }}
      code: ${{ steps.changes.outputs.code }}
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: 🔎 Detect Changed Files
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            iac:
              - 'iac/**'
            docs:
              - 'docs/**'
            code:
              - '**'
              - '!iac/**'
              - '!docs/**'

  validate-docs:
    name: 📚 Validate Documentation
    needs: determine-scope
    if: needs.determine-scope.outputs.docs == 'true'
    runs-on: ubuntu-latest
    environment: ci-cd
    timeout-minutes: 5

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 📷 pnpm Dependencies Cache
        uses: actions/cache@v5
        with:
          path: |
            docs/node_modules
          key: ${{ runner.os }}-pnpm-docs-${{ hashFiles('docs/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-docs-

      - name: 💾 Install pnpm Dependencies
        run: |
          cd docs/
          pnpm install --frozen-lockfile --prefer-offline

      - name: 🔧 Build Documentation
        run: |
          cd docs/
          pnpm build

