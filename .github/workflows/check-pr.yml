  lint-and-format:
    name: 🔍 Lint, Format & Analyse
    needs: determine-scope
    if: needs.determine-scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    environment: ci-cd
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: root
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 5

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.EACD_BOT_FOR_COMMIT_PAT || github.token }}

      - name: 🔁 Setup Environment
        uses: ./.github/actions/common-setup
        with:
          php-version: ${{ env.PHP_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          build-frontend-assets: false

      - name: 📷 Rector Cache
        uses: actions/cache@v5
        with:
          path: /tmp/rector
          key: ${{ runner.os }}-rector-${{ hashFiles('rector.php', 'composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-rector-

      - name: 📷 Pint Cache
        uses: actions/cache@v5
        with:
          path: ./storage/pint.cache
          key: ${{ runner.os }}-pint-${{ hashFiles('pint.json', 'composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-pint-

      - name: 📷 Prettier Cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules/.cache/prettier
            .prettier-cache
          key: prettier-${{ hashFiles('package.json', 'pnpm-lock.yaml', '.prettierrc') }}
          restore-keys: |
            prettier-${{ hashFiles('package.json', 'pnpm-lock.yaml', '.prettierrc') }}-
            prettier-

      - name: 🔧️ Run Rector
        run: composer rector

      - name: 🍺 Run Laravel Pint
        run: composer format:php

      - name: ✨ Run Prettier
        run: composer format:frontend

      - name: 📄 Regenerate OpenAPI Schemas
        run: |
          composer openapi:generate:v1

      - name: ❌ Remove Debug Code from Tests
        run: |
          # Remove it.only() from Cypress tests
          files=`grep -lR 'it.only' cypress/e2e/*.cy.ts || true`
          if [ ! -z "$files" ]; then
            echo "Found 'it.only()' in the following files: $files"
            for file in $files; do
              sed -i -e 's/it.only/it/g' "$file"
            done
          fi

          # Remove describe.only() from Cypress tests
          files=`grep -lR 'describe.only' cypress/e2e/*.cy.ts || true`
          if [ ! -z "$files" ]; then
            echo "Found 'describe.only()' in the following files: $files"
            for file in $files; do
              sed -i -e 's/describe.only/describe/g' "$file"
            done
          fi

          # Remove test.only() from PHP tests
          files=`grep -lR 'test\.only' tests/ || true`
          if [ ! -z "$files" ]; then
            echo "Found 'test.only()' in the following files: $files"
            for file in $files; do
              sed -i -e 's/test\.only(/test(/g' "$file"
            done
          fi

      - name: 🔄 Restore IDE Helper Annotations
        run: git restore 'app/Domains/*/Models/*.php'

      - name: 📷 PHPStan Result Cache
        uses: actions/cache@v5
        with:
          path: /tmp/phpstan
          key: phpstan-results-${{ hashFiles('phpstan.neon', 'composer.lock') }}
          restore-keys: |
            phpstan-results-${{ hashFiles('phpstan.neon') }}-
            phpstan-results-

      - name: 🔬 PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress --error-format=checkstyle > phpstan-report.xml

      - name: 📊 Publish PHPStan Report
        if: github.actor != 'dependabot[bot]' && always()
        uses: lcollins/checkstyle-github-action@v3.1.0
        with:
          name: "📊 PHPStan Analysis Report"
          path: "phpstan-report.xml"
          title: "PHPStan Analysis Report"

      - name: 🔍 Check for Uncommitted Changes
        id: file-changes
        run: echo "changes=$(if git diff --quiet; then echo 'false'; else echo 'true'; fi)" >> $GITHUB_OUTPUT

      - name: 📝 Auto-Commit Code Style Fixes
        if: steps.file-changes.outputs.changes == 'true'
        run: |
          git config --global user.name "ADOES Bot"
          git config --global user.email "DL_NUIT_ET_SysDev@e.northwestern.edu"
          git commit -a -m "style: apply automated formatting"
          git push
          exit 1

  unit-tests:
    name: 🧪 Unit Tests (${{ matrix.shard }}/3)
    needs: [determine-scope]
    if: needs.determine-scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    environment: ci-cd
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: root
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 5

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: 🔁 Setup Environment
        uses: ./.github/actions/common-setup
        with:
          php-version: ${{ env.PHP_VERSION }}
          php-only: true
          run-ide-helper: false
          coverage: pcov

      - name: 📷 PHPUnit Cache
        uses: actions/cache@v5
        with:
          path: ./.phpunit.cache
          key: ${{ runner.os }}-phpunit-${{ hashFiles('phpunit.xml', 'composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-phpunit-

      - name: 🎯 Configure PHPUnit Matcher
        uses: mheap/phpunit-matcher-action@v1

      # If you need to debug tests or follow the execution order more clearly, replace `--teamcity` with `--verbose`
      - name: 🧪 PHPUnit
        run: >
          ./vendor/bin/pest --parallel
          --shard ${{ matrix.shard }}/3
          --cache-result
          --cache-directory=.phpunit.cache
          --log-junit .build/junit-pr${{ github.event.pull_request.number }}-run${{ github.run_id }}-shard${{ matrix.shard }}.xml
          --coverage-php .build/coverage-shard${{ matrix.shard }}.cov
          --teamcity

      - name: 📦 Upload Test Results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Test Results PR${{ github.event.pull_request.number }} Run${{ github.run_id }} Shard${{ matrix.shard }}
          path: .build/junit-pr${{ github.event.pull_request.number }}-run${{ github.run_id }}-shard${{ matrix.shard }}.xml
          retention-days: 1

      - name: 📦 Upload Coverage Data
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Coverage Shard${{ matrix.shard }}
          path: .build/coverage-shard${{ matrix.shard }}.cov
          retention-days: 1

  publish-test-results:
    name: 📊 Publish Test Results
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always() && github.actor != 'dependabot[bot]' && needs.determine-scope.outputs.code == 'true'

    steps:
      - name: 📥 Download Test Results
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: Test Results PR${{ github.event.pull_request.number }} Run${{ github.run_id }}*
          merge-multiple: true

      - name: 📊 Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2.7
        with:
          check_name: "📊 PHPUnit Test Results"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: "artifacts/**/*.xml"

  coverage-report:
    name: 📈 Coverage Report
    needs: [unit-tests, determine-scope]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always() && github.actor != 'dependabot[bot]' && needs.determine-scope.outputs.code == 'true'
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v6

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
          tools: phpunit/phpcov

      - name: 📥 Download Coverage Shards
        uses: actions/download-artifact@v7
        with:
          path: .build/coverage-shards
          pattern: Coverage Shard*
          merge-multiple: true

      - name: 🔀 Merge Coverage Shards
        run: |
          mkdir -p .build
          phpcov merge --clover .build/clover.xml .build/coverage-shards

      - name: 📊 Generate Coverage Report
        id: coverage
        uses: clearlyip/code-coverage-report-action@v6
        with:
          filename: .build/clover.xml
          artifact_download_workflow_names: "Check PR"

      - name: 💬 Coverage PR Comment
        if: github.event_name == 'pull_request' && steps.coverage.outputs.file != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: code-coverage-results.md

  end-to-end-tests:
    name: 🌲 Cypress Tests
    needs: [determine-scope]
    if: needs.determine-scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    environment: ci-cd
    timeout-minutes: 30
    # strategy:
    #  fail-fast: false
    #  matrix:
    #    Run copies of the current job in parallel
    #    containers: [1, 2, 3, 4]
    services:
      s3:
        image: minio/minio:edge-cicd
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: s3admin
          MINIO_ROOT_PASSWORD: s3secret
        options: --health-cmd "curl -s http://localhost:9000/minio/health/live" --health-interval 3s --health-timeout 3s --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: root
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 5

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.EACD_BOT_FOR_COMMIT_PAT || github.token }}

      - name: 🔁 Setup Environment
        uses: ./.github/actions/common-setup
        with:
          php-version: ${{ env.PHP_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          install-cypress: true
          run-ide-helper: false

      - name: 📷 Minio Client Cache
        id: mc-cache
        uses: actions/cache@v5
        with:
          path: ./mc
          key: minio-mc-linux-amd64

      - name: 🪣 Create Minio Bucket
        run: |
          if [ ! -f ./mc ]; then
            curl -o ./mc -# https://dl.min.io/client/mc/release/linux-amd64/mc
          fi
          chmod +x ./mc
          ./mc alias set gha http://localhost:9000 s3admin s3secret
          ./mc mb gha/northwestern-laravel-starter

      - name: 🌲 Cypress
        uses: cypress-io/github-action@v7
        with:
          config: baseUrl=http://localhost:8000
          start: php artisan serve --port=8000 --no-reload
          wait-on: http://localhost:8000
          wait-on-timeout: 180
          browser: chrome
          # group: "Integration Tests - Chrome"
          # record: true
          # parallel: true
        env:
          # CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: s3admin
          AWS_SECRET_ACCESS_KEY: s3secret
          PHP_CLI_SERVER_WORKERS: 4

      - name: 📜 Display Laravel Logs
        if: always()
        run: cat -n storage/logs/laravel.log | fold -w 120  || true

      # This step can be removed if your project records results directly to Cypress Cloud
      - name: 📜 Publish Test Summary Results
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: .build/ctrf-report.json
          pull-request: true
          github-report: true
          overwrite-comment: true
          upload-artifact: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: always()
