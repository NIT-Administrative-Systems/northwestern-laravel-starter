  lint-and-format:
    name: 🔍 Lint, Format & Analyse
    needs: determine-scope
    if: needs.determine-scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    environment: ci-cd
    timeout-minutes: 15
    permissions:
        contents: write
        actions: read
        checks: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: root
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 5

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: 🔁 Setup Environment
        uses: ./.github/actions/common-setup
        with:
          php-version: ${{ env.PHP_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          build-frontend-assets: false

      - name: 📷 Rector Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/rector
          key: ${{ runner.os }}-rector-${{ hashFiles('rector.php', 'composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-rector-

      - name: 📷 Pint Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./storage/pint.cache
          key: ${{ runner.os }}-pint-${{ hashFiles('pint.json', 'composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-pint-

      - name: 📷 Prettier Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.cache/prettier
            .prettier-cache
          key: prettier-${{ hashFiles('package.json', 'pnpm-lock.yaml', '.prettierrc') }}
          restore-keys: |
            prettier-${{ hashFiles('package.json', 'pnpm-lock.yaml', '.prettierrc') }}-
            prettier-

      - name: 🔧️ Run Rector
        run: composer rector

      - name: 🍺 Run Laravel Pint
        run: composer format:php

      - name: ✨ Run Prettier
        run: composer format:frontend

      - name: 📄 Regenerate OpenAPI Schemas
        run: |
          composer openapi:generate:v1

      # Pest's --ci flag runs every test even when one is marked ->only(). A ->debug() in a browser
      # test opens a visible browser and waits for a key press, which a runner can't do.
      - name: ❌ Check Browser Tests for Debug Calls
        run: |
          if grep -rnE -- '->(debug|tinker)\(' tests/Browser; then
            echo "::error::Remove ->debug() and ->tinker() from browser tests before merging."
            exit 1
          fi

      - name: 🔄 Restore IDE Helper Annotations
        run: git restore 'app/Domains/*/Models/*.php'

      - name: 📷 PHPStan Result Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/phpstan
          key: phpstan-results-${{ hashFiles('phpstan.neon', 'composer.lock') }}
          restore-keys: |
            phpstan-results-${{ hashFiles('phpstan.neon') }}-
            phpstan-results-

      - name: 🔬 PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress --error-format=checkstyle > phpstan-report.xml

      - name: 📊 Publish PHPStan Report
        if: github.actor != 'dependabot[bot]' && always()
        uses: lcollins/checkstyle-github-action@832a70dc40e28517ddb45ac5ac8b2ad1279bd54d # v4.0.0
        with:
          name: "📊 PHPStan Analysis Report"
          path: "phpstan-report.xml"
          title: "PHPStan Analysis Report"

      - name: 🔍 Check for Uncommitted Changes
        id: file-changes
        run: echo "changes=$(if git diff --quiet; then echo 'false'; else echo 'true'; fi)" >> "$GITHUB_OUTPUT"

      - name: 📝 Auto-Commit Code Style Fixes
        if: steps.file-changes.outputs.changes == 'true'
        run: |
          git config --global user.name "ADOES Bot"
          git config --global user.email "DL_NUIT_ET_SysDev@e.northwestern.edu"
          git commit -a -m "style: apply automated formatting"
          git push
          exit 1

  unit-tests:
    name: 🧪 Unit Tests (${{ matrix.shard }}/3)
    needs: [determine-scope]
    if: needs.determine-scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    environment: ci-cd
    timeout-minutes: 20
    permissions:
        contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: root
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 5

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔁 Setup Environment
        uses: ./.github/actions/common-setup
        with:
          php-version: ${{ env.PHP_VERSION }}
          php-only: true
          run-ide-helper: false
          coverage: pcov

      - name: 📷 PHPUnit Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./.phpunit.cache
          key: ${{ runner.os }}-phpunit-${{ hashFiles('phpunit.xml', 'composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-phpunit-

      - name: 🎯 Configure PHPUnit Matcher
        uses: mheap/phpunit-matcher-action@dcbd4ead41890163b65d0b21534387ce72980ee5 # v1.4.0

      # If you need to debug tests or follow the execution order more clearly, replace `--teamcity` with `--verbose`
      - name: 🧪 PHPUnit
        run: >
          ./vendor/bin/pest --parallel --ci
          --shard ${{ matrix.shard }}/3
          --cache-result
          --cache-directory=.phpunit.cache
          --log-junit .build/junit-pr${{ github.event.pull_request.number }}-run${{ github.run_id }}-shard${{ matrix.shard }}.xml
          --coverage-php .build/coverage-shard${{ matrix.shard }}.cov
          --teamcity

      - name: 📦 Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: Test Results PR${{ github.event.pull_request.number }} Run${{ github.run_id }} Shard${{ matrix.shard }}
          path: .build/junit-pr${{ github.event.pull_request.number }}-run${{ github.run_id }}-shard${{ matrix.shard }}.xml
          retention-days: 1

      - name: 📦 Upload Coverage Data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: Coverage Shard${{ matrix.shard }}
          path: .build/coverage-shard${{ matrix.shard }}.cov
          retention-days: 1

  publish-test-results:
    name: 📊 Unit Test Results
    needs: [unit-tests, determine-scope]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always() && github.actor != 'dependabot[bot]' && needs.determine-scope.outputs.code == 'true'
    permissions:
        contents: read
        checks: write
        pull-requests: write
        actions: read

    steps:
      - name: 📥 Download Test Results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: Test Results PR${{ github.event.pull_request.number }} Run${{ github.run_id }}*
          merge-multiple: true

      - name: 📊 Publish Unit Test Results
        id: test-results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          check_name: "📊 PHPUnit Test Results"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: "artifacts/**/*.xml"

      # This will cause "📊 Unit Test Results" to fail if there are failures from any of the test shards.
      #
      # This is the item that should be required in the protection ruleset, instead of the "📊 PHPUnit Test Results"
      # check created by the prior step. Checks created this way may be attached to a random workflow that runs around
      # the same time -- like the Copilot Review workflow. Then it won't count for the ruleset and PRs will be stuck
      # unmergeable.
      #
      # See <https://github.com/EnricoMi/publish-unit-test-result-action/issues/12>.
      - name: 📉 Fail on Errors
        if: ${{ fromJSON( steps.test-results.outputs.json ).conclusion != 'success' }}
        run: |
          false

  coverage-report:
    name: 📈 Coverage Report
    needs: [unit-tests, determine-scope]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always() && github.actor != 'dependabot[bot]' && needs.determine-scope.outputs.code == 'true'
    permissions:
        contents: read
        actions: read
        pull-requests: write
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
          tools: phpunit/phpcov:^13

      - name: 📥 Download Coverage Shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: .build/coverage-shards
          pattern: Coverage Shard*
          merge-multiple: true

      - name: 🔀 Merge Coverage Shards
        run: |
          mkdir -p .build
          phpcov merge --clover .build/clover.xml .build/coverage-shards

      - name: 📊 Generate Coverage Report
        id: coverage
        uses: clearlyip/code-coverage-report-action@110af9d4ec87b6706f182fd90e3102af9e5203bf # v7.0
        with:
          filename: .build/clover.xml
          artifact_download_workflow_names: "Check PR"
          with_base_coverage_template: .github/coverage-with-base.hbs
          without_base_coverage_template: .github/coverage-without-base.hbs

      - name: 💬 Coverage PR Comment
        if: github.event_name == 'pull_request' && steps.coverage.outputs.file != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          recreate: true
          path: code-coverage-results.md

      # This step can be removed entirely if your project does not use Coveralls. If you do, make sure to set
      # the COVERALLS_REPO_TOKEN secret in your repository settings and remove the `if` condition below.
      - name: 📤 Upload to Coveralls
        if: github.repository == 'NIT-Administrative-Systems/northwestern-laravel-starter'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: .build/clover.xml
          fail-on-error: false

  browser-tests:
    name: 🌐 Browser Tests
    needs: [determine-scope]
    if: needs.determine-scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    environment: ci-cd
    timeout-minutes: 20
    permissions:
        contents: read
        checks: write
        pull-requests: write
    # S3-compatible object storage, as in production: .env.ci points the application at it, so
    # tests that upload files exercise real signed URLs and CORS.
    services:
      s3:
        image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: ${{ env.S3_USERNAME }}
          RUSTFS_SECRET_KEY: ${{ env.S3_PASSWORD }}
          RUSTFS_CONSOLE_ENABLE: 'false'
        options: --health-cmd "curl -fsS http://localhost:9000/health/ready" --health-interval 3s --health-timeout 3s --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: root
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 5

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔁 Setup Environment
        uses: ./.github/actions/common-setup
        with:
          php-version: ${{ env.PHP_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          install-playwright: true
          run-ide-helper: false

      # Livewire uploads straight from the browser to the bucket with a signed PUT. The browser tests
      # serve the application on 127.0.0.1 at a random port, so the CI bucket allows any origin.
      - name: 🪣 Create S3 Bucket and Configure Uploads
        run: |
          aws --endpoint-url http://localhost:9000 s3api create-bucket --bucket northwestern-laravel-starter
          aws --endpoint-url http://localhost:9000 s3api put-bucket-cors \
            --bucket northwestern-laravel-starter \
            --cors-configuration '{"CORSRules":[{"AllowedOrigins":["*"],"AllowedMethods":["GET","PUT","HEAD"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag"]}]}'
        env:
          AWS_ACCESS_KEY_ID: ${{ env.S3_USERNAME }}
          AWS_SECRET_ACCESS_KEY: ${{ env.S3_PASSWORD }}
          AWS_DEFAULT_REGION: us-east-1

      - name: 🎯 Configure PHPUnit Matcher
        uses: mheap/phpunit-matcher-action@dcbd4ead41890163b65d0b21534387ce72980ee5 # v1.4.0

      # The application runs inside the test process, so there's no server to start. A failed
      # assertion saves a screenshot to tests/Browser/Screenshots.
      - name: 🌐 Run Browser Tests
        run: >
          ./vendor/bin/pest
          --testsuite=Browser
          --parallel
          --ci
          --log-junit .build/junit-browser.xml
          --teamcity
        # The application runs inside this process, so it reads the bucket's credentials from here.
        env:
          AWS_ACCESS_KEY_ID: ${{ env.S3_USERNAME }}
          AWS_SECRET_ACCESS_KEY: ${{ env.S3_PASSWORD }}

      - name: 📸 Upload Failure Screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Browser Test Screenshots PR${{ github.event.pull_request.number }} Run${{ github.run_id }}
          path: tests/Browser/Screenshots
          retention-days: 7

      - name: 📜 Display Laravel Logs
        if: always()
        run: cat -n storage/logs/laravel.log | fold -w 120 || true

      - name: 📊 Publish Browser Test Results
        if: always() && github.actor != 'dependabot[bot]'
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          check_name: "🌐 Browser Test Results"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: .build/junit-browser.xml
