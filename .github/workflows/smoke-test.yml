name: Smoke Test
run-name: "Smoke Test | ${{ inputs.version || github.event.release.tag_name || format('dev-{0}', github.ref_name) }}"

env:
  NODE_VERSION: '26'
  PNPM_VERSION: '11.x.x'
  PHP_VERSION: '8.5'

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Tagged version to test (e.g., v1.7.0). Leave empty to test the selected branch."
        required: false
        type: string

jobs:
  create-project:
    name: composer create-project
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
        contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: root
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 5

    steps:
      - name: 🔢 Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
            COMPOSER="${TAG#v}"
            VCS=""
          elif [ -n "$INPUT_VERSION" ] && [[ "$INPUT_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            TAG="$INPUT_VERSION"
            COMPOSER="${TAG#v}"
            VCS=""
          else
            BRANCH="${INPUT_VERSION:-$REF_NAME}"
            TAG="dev-$BRANCH"
            COMPOSER="dev-$BRANCH"
            VCS="--repository={\"type\":\"vcs\",\"url\":\"https://github.com/$GH_REPO\"} --stability=dev"
          fi

          {
            echo "tag=$TAG"
            echo "composer=$COMPOSER"
            echo "vcs=$VCS"
          } >> "$GITHUB_OUTPUT"
          echo "Testing version: $TAG (composer: $COMPOSER)"

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: >-
            ctype, curl, dom, fileinfo, filter, hash, iconv, intl, json, libxml,
            mbstring, openssl, pcre, pdo, pdo_pgsql, phar, reflection, session,
            simplexml, sodium, tokenizer, xml, xmlreader, xmlwriter, zip
          ini-values: memory_limit=-1

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Release-triggered workflow: keep the cache surface closed against poisoning.
          package-manager-cache: false

      - name: 📦 composer create-project
        env:
          VERSION: ${{ steps.version.outputs.composer }}
          VCS_ARGS: ${{ steps.version.outputs.vcs }}
        run: |
          # shellcheck disable=SC2086 # VCS_ARGS intentionally word-splits into optional flags
          composer create-project \
            northwestern-sysdev/northwestern-laravel-starter \
            test-project \
            "$VERSION" \
            $VCS_ARGS \
            --prefer-dist \
            --no-interaction

      - name: ✅ Validate post-install hooks
        working-directory: test-project
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          echo "--- Checking .env exists (post-root-package-install) ---"
          test -f .env || { echo "::error::.env file not created"; exit 1; }

          echo "--- Checking APP_KEY was generated (post-create-project-cmd) ---"
          grep -q "^APP_KEY=base64:" .env || { echo "::error::APP_KEY not generated"; exit 1; }

          echo "--- Checking .starter-version.yaml exists ---"
          test -f .starter-version.yaml || { echo "::error::.starter-version.yaml not found"; exit 1; }
          if [[ "$VERSION" != dev-* ]]; then
            echo "--- Checking .starter-version.yaml matches release ---"
            grep -q "version: $VERSION" .starter-version.yaml || { echo "::error::.starter-version.yaml does not contain $VERSION"; exit 1; }
          fi

          echo "--- Validating composer.json ---"
          composer validate --strict

          echo "All post-install hook validations passed."

      - name: ⚙️ Configure CI environment
        working-directory: test-project
        run: |
          cp .env.ci .env
          php artisan key:generate

      - name: 🗄️ Run migrations
        working-directory: test-project
        run: php artisan migrate --force

      - name: 🌱 Run seeders
        working-directory: test-project
        run: php artisan db:seed --force

      - name: 💾 Install pnpm dependencies
        working-directory: test-project
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build frontend assets
        working-directory: test-project
        run: pnpm build

      - name: ✅ Verify Vite manifest
        working-directory: test-project
        run: test -f public/build/manifest.json || { echo "::error::Vite manifest not found"; exit 1; }

      - name: 🧪 Run test suite
        working-directory: test-project
        run: php artisan test --parallel

      - name: 🔒 Verify config and route caching
        working-directory: test-project
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan event:cache

      - name: 🚀 Boot application
        working-directory: test-project
        run: |
          php artisan serve --port=8000 &

          echo "Waiting for server..."
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8000 > /dev/null 2>&1; then
              echo "Server is ready."
              break
            fi
            sleep 1
          done

          echo "--- Verifying application responds ---"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000)
          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "::error::Expected successful response, got HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Application boots successfully (HTTP $HTTP_STATUS)."

      - name: 📜 Dump Laravel logs
        if: failure()
        working-directory: test-project
        run: cat storage/logs/laravel.log 2>/dev/null || echo "No Laravel log file found."
