name: Create Release
run-name: Create Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.5.0)"
        required: true
        type: string

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must match format v#.#.# (e.g., v1.5.0)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Check version doesn't already exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git tag -l | grep -qx "$VERSION"; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi

      - name: Check version is newer than latest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -n "$LATEST" ]; then
            LATEST_CLEAN=${LATEST#v}
            NEW_CLEAN=${VERSION#v}
            if ! printf '%s\n%s\n' "$LATEST_CLEAN" "$NEW_CLEAN" \
                 | sort -V | tail -n1 | grep -qx "$NEW_CLEAN"; then
              echo "::error::$VERSION is not newer than $LATEST"
              exit 1
            fi
          fi

      - name: Validate changelog entry
        env:
          VERSION: ${{ inputs.version }}
        run: |
          CHANGELOG_HEADING=$(grep -m1 "^## \[$VERSION\] -" CHANGELOG.md || true)
          if [ -z "$CHANGELOG_HEADING" ]; then
            echo "::error::Could not find changelog entry for $VERSION in CHANGELOG.md"
            exit 1
          fi

          CHANGELOG_ANCHOR=$(python3 -c '
          import re
          import sys
          import unicodedata

          heading = re.sub(r"^#+\s*", "", sys.argv[1]).strip().lower()
          heading = unicodedata.normalize("NFKD", heading)
          heading = "".join(c for c in heading if not unicodedata.combining(c))
          heading = re.sub(r"[^\w\- ]", "", heading)
          heading = re.sub(r"\s+", "-", heading)
          print(heading)
          ' "$CHANGELOG_HEADING")

          echo "CHANGELOG_ANCHOR=$CHANGELOG_ANCHOR" >> "$GITHUB_ENV"

      - name: Bump .starter-version.yaml
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cat > .starter-version.yaml << EOF
          # Northwestern Laravel Starter
          #
          # This file tracks the version of the starter template that this project
          # was originally cloned from. It serves as a reference point to compare
          # against newer releases of the upstream template.
          #
          # To see changes introduced since this version, visit:
          # https://github.com/NIT-Administrative-Systems/northwestern-laravel-starter/releases

          version: $VERSION
          EOF

      - name: Commit and push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .starter-version.yaml
          git commit -m "chore: bump starter version to $VERSION [skip ci]"
          git push origin main

      - name: Create GitHub release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release create "$VERSION" \
            --target main \
            --title "$VERSION" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md#$CHANGELOG_ANCHOR) for details."
