openapi: 3.0.0
info:
  title: 'Northwestern Laravel Starter API'
  description: 'Core API endpoints provided by the Northwestern Laravel Starter, including user profile information and access token management.'
  version: 1.0.0
paths:
  /api/v1/me:
    get:
      tags:
        - Users
      summary: 'Get authenticated user details'
      operationId: get-user-details
      responses:
        '200':
          description: 'Authenticated user profile.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: 'Missing or invalid bearer token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        -
          oauth2: []
        -
          bearerToken: []
components:
  schemas:
    Permission:
      required:
        - id
        - name
        - label
        - scope
        - system_managed
        - api_relevant
      properties:
        id:
          type: integer
          format: int64
          example: 17
        name:
          description: 'Machine-friendly permission name.'
          type: string
          example: manage-users
        label:
          description: 'Human readable permission label.'
          type: string
          example: 'Manage Users'
        description:
          type: string
          example: 'Allows creating, editing, and disabling user accounts.'
          nullable: true
        scope:
          description: "Whether this permission applies system-wide or only to the authenticated user's context."
          type: string
          example: system-wide
          enum:
            - system-wide
            - personal
        system_managed:
          type: boolean
          example: false
        api_relevant:
          description: 'Whether this permission impacts API access patterns.'
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: '2024-02-10T16:22:00Z'
          nullable: true
        updated_at:
          type: string
          format: date-time
          example: '2024-04-02T19:43:12Z'
          nullable: true
      type: object
    RoleType:
      required:
        - slug
        - label
      properties:
        slug:
          type: string
          example: api-integration
          enum:
            - system-managed
            - application-admin
            - application-role
            - api-integration
        label:
          type: string
          example: 'API Integration'
      type: object
    Role:
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          example: 4
        name:
          type: string
          example: 'Content Manager'
        assignment_locked:
          type: boolean
          example: false
        role_type:
          oneOf:
            -
              $ref: '#/components/schemas/RoleType'
          nullable: true
          description: 'Included when the role_type relationship is loaded.'
        created_at:
          type: string
          format: date-time
          example: '2025-01-15T18:00:00Z'
          nullable: true
        updated_at:
          type: string
          format: date-time
          example: '2025-04-21T12:05:23Z'
          nullable: true
        permissions:
          description: 'Included when permissions are eager loaded.'
          type: array
          items:
            $ref: '#/components/schemas/Permission'
          nullable: true
        users_count:
          description: 'Included when a user count aggregate is loaded.'
          type: integer
          example: 18
          nullable: true
      type: object
    User:
      required:
        - id
        - username
        - auth_type
        - first_name
        - last_name
        - full_name
        - email
      properties:
        id:
          type: integer
          format: int64
          example: 1024
        username:
          type: string
          example: abc123
        auth_type:
          description: 'How the user authenticates to the application.'
          type: string
          example: api
          enum:
            - sso
            - local
            - api
        first_name:
          type: string
          example: NUIT
        last_name:
          type: string
          example: API
        full_name:
          type: string
          example: 'NUIT API'
        email:
          type: string
          format: email
          example: nuit.api@example.edu
        primary_affiliation:
          description: 'Primary Northwestern affiliation for the user.'
          type: string
          example: not-matched
          nullable: true
          enum:
            - student
            - faculty
            - staff
            - affiliate
            - not-matched
        departments:
          type: array
          items:
            type: string
          example:
            - 'IT Services'
            - 'Information Security'
        job_titles:
          type: array
          items:
            type: string
          example:
            - 'Systems Administrator'
        created_at:
          type: string
          format: date-time
          example: '2023-11-06T15:20:00Z'
          nullable: true
        updated_at:
          type: string
          format: date-time
          example: '2024-04-09T18:45:10Z'
          nullable: true
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          nullable: true
      type: object
    UserResponse:
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/User'
      type: object
      example:
        data:
          id: 1
          username: waw1234
          auth_type: api
          first_name: NUIT
          last_name: API
          full_name: 'NUIT API'
          email: null
          primary_affiliation: not-matched
          departments: []
          job_titles: []
          created_at: '2025-11-06T15:20:00+00:00'
          updated_at: '2025-04-09T18:45:10+00:00'
          roles:
            -
              id: 1
              name: 'API Role'
              role_type:
                slug: api-integration
                label: 'API Integration'
              created_at: '2025-11-06T15:20:00+00:00'
              updated_at: '2025-11-06T15:20:00+00:00'
              permissions:
                -
                  id: 1
                  name: view-users
                  label: 'View Users'
                  description: 'Allows viewing all user profiles and their details.'
                  scope: system-wide
                  system_managed: false
                  api_relevant: true
                  created_at: '2025-11-06T15:20:00+00:00'
                  updated_at: '2025-11-06T15:20:00+00:00'
    PaginationLinks:
      required:
        - first
        - last
        - prev
        - next
      properties:
        first:
          type: string
          format: uri
          example: 'https://example.test/api/v1/me/tokens?page=1'
        last:
          type: string
          format: uri
          example: 'https://example.test/api/v1/me/tokens?page=1'
        prev:
          type: string
          format: uri
          example: null
          nullable: true
        next:
          type: string
          format: uri
          example: null
          nullable: true
      type: object
    PaginationLink:
      required:
        - label
        - page
        - active
      properties:
        url:
          type: string
          format: uri
          example: 'https://example.test/api/v1/me/tokens?page=1'
          nullable: true
        label:
          type: string
          example: '&laquo; Previous'
        page:
          type: integer
          example: null
          nullable: true
        active:
          type: boolean
          example: false
      type: object
    PaginationMeta:
      required:
        - current_page
        - from
        - last_page
        - path
        - per_page
        - to
        - total
        - links
      properties:
        current_page:
          type: integer
          example: 1
        from:
          type: integer
          example: 1
          nullable: true
        last_page:
          type: integer
          example: 1
        path:
          type: string
          format: uri
          example: 'https://example.test/api/v1/me/tokens'
        per_page:
          type: integer
          example: 20
        to:
          type: integer
          example: 15
          nullable: true
        total:
          type: integer
          example: 15
        links:
          type: array
          items:
            $ref: '#/components/schemas/PaginationLink'
          example:
            -
              url: null
              label: '&laquo; Previous'
              page: null
              active: false
            -
              url: 'https://example.test/api/v1/me/tokens?page=1'
              label: '1'
              page: 1
              active: true
            -
              url: null
              label: 'Next &raquo;'
              page: null
              active: false
      type: object
    ProblemDetails:
      description: 'Standard RFC 9457 problem details envelope.'
      required:
        - type
        - title
        - status
        - instance
      properties:
        type:
          description: 'RFC 9457 compliant problem details response builder.'
          type: string
          format: uri
          example: 'about:blank'
        title:
          type: string
          example: Unauthorized
        status:
          type: integer
          example: 401
        detail:
          type: string
          example: 'Authentication failed'
          nullable: true
        instance:
          type: string
          format: uri-reference
          example: /api/v1/me
        trace_id:
          description: 'Unique identifier for the API request (if available).'
          type: string
          example: b4f5aa7a-1470-4d92-8d3c-98e7c7de9f5f
          nullable: true
      type: object
    ValidationProblemDetails:
      allOf:
        -
          $ref: '#/components/schemas/ProblemDetails'
        -
          properties:
            errors:
              description: 'Validation errors keyed by input field.'
              type: object
              example:
                name:
                  - 'The name field is required.'
                expires_at:
                  - 'The expires at must be at least 24 hours from now.'
              additionalProperties:
                type: array
                items:
                  type: string
          type: object
  securitySchemes:
    oauth2:
      type: oauth2
      description: "OAuth 2.0. Service integrations use the client credentials flow with a client created in Administration; the access token acts as the client's API user."
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes: {}
    bearerToken:
      type: http
      description: 'An OAuth access token, sent as a bearer token in the Authorization header.'
      scheme: bearer
tags:
  -
    name: Users
    description: 'Retrieve information about the authenticated API user.'
