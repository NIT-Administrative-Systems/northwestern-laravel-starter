openapi: 3.1.0
info:
  title: 'Northwestern Laravel Starter API'
  description: 'The API endpoints the Northwestern Laravel Starter ships. Applications add their own beside them.'
  version: 1.0.0
paths:
  /api/v1/me:
    get:
      tags:
        - Users
      summary: 'Get authenticated user details'
      operationId: get-user-details
      responses:
        '200':
          description: 'Authenticated user profile.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: 'Missing or invalid bearer token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        -
          oauth2: []
        -
          bearerToken: []
components:
  schemas:
    Permission:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 17
        name:
          type: string
          description: 'Machine-friendly permission name.'
          example: manage-users
        label:
          type: string
          description: 'Human readable permission label.'
          example: 'Manage Users'
        description:
          type:
            - string
            - 'null'
          example: 'Allows creating, editing, and disabling user accounts.'
        scope:
          type: string
          description: "Whether this permission applies system-wide or only to the authenticated user's context."
          enum:
            - system-wide
            - personal
          example: system-wide
        system_managed:
          type: boolean
          example: false
        api_relevant:
          type: boolean
          description: 'Whether this permission impacts API access patterns.'
          example: true
        created_at:
          type:
            - string
            - 'null'
          format: date-time
          example: '2024-02-10T16:22:00Z'
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
          example: '2024-04-02T19:43:12Z'
      required:
        - id
        - name
        - label
        - scope
        - system_managed
        - api_relevant
    RoleType:
      type: object
      properties:
        slug:
          type: string
          enum:
            - system-managed
            - application-admin
            - application-role
            - api-integration
          example: api-integration
        label:
          type: string
          example: 'API Integration'
      required:
        - slug
        - label
    Role:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 4
        name:
          type: string
          example: 'Content Manager'
        assignment_locked:
          type: boolean
          example: false
        role_type:
          oneOf:
            -
              $ref: '#/components/schemas/RoleType'
              description: 'Included when the role_type relationship is loaded.'
            -
              type: 'null'
          description: 'Included when the role_type relationship is loaded.'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
          example: '2025-01-15T18:00:00Z'
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
          example: '2025-04-21T12:05:23Z'
        permissions:
          type:
            - array
            - 'null'
          description: 'Included when permissions are eager loaded.'
          items:
            $ref: '#/components/schemas/Permission'
        users_count:
          type:
            - integer
            - 'null'
          description: 'Included when a user count aggregate is loaded.'
          example: 18
      required:
        - id
        - name
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1024
        username:
          type: string
          example: abc123
        auth_type:
          type: string
          description: 'How the user authenticates to the application.'
          enum:
            - sso
            - local
            - api
          example: api
        first_name:
          type: string
          example: NUIT
        last_name:
          type: string
          example: API
        full_name:
          type: string
          example: 'NUIT API'
        email:
          type: string
          format: email
          example: nuit.api@example.edu
        primary_affiliation:
          type:
            - string
            - 'null'
          description: 'Primary Northwestern affiliation for the user.'
          enum:
            - student
            - faculty
            - staff
            - affiliate
            - not-matched
          example: not-matched
        departments:
          type: array
          items:
            type: string
          example:
            - 'IT Services'
            - 'Information Security'
        job_titles:
          type: array
          items:
            type: string
          example:
            - 'Systems Administrator'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
          example: '2023-11-06T15:20:00Z'
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
          example: '2024-04-09T18:45:10Z'
        roles:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/Role'
      required:
        - id
        - username
        - auth_type
        - first_name
        - last_name
        - full_name
        - email
    UserResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/User'
      required:
        - data
      example:
        data:
          id: 1
          username: waw1234
          auth_type: api
          first_name: NUIT
          last_name: API
          full_name: 'NUIT API'
          email: null
          primary_affiliation: not-matched
          departments: []
          job_titles: []
          created_at: '2025-11-06T15:20:00+00:00'
          updated_at: '2025-04-09T18:45:10+00:00'
          roles:
            -
              id: 1
              name: 'API Role'
              role_type:
                slug: api-integration
                label: 'API Integration'
              created_at: '2025-11-06T15:20:00+00:00'
              updated_at: '2025-11-06T15:20:00+00:00'
              permissions:
                -
                  id: 1
                  name: view-users
                  label: 'View Users'
                  description: 'Allows viewing all user profiles and their details.'
                  scope: system-wide
                  system_managed: false
                  api_relevant: true
                  created_at: '2025-11-06T15:20:00+00:00'
                  updated_at: '2025-11-06T15:20:00+00:00'
    PaginationLinks:
      type: object
      properties:
        first:
          type: string
          format: uri
          example: 'https://example.test/api/v1/records?page=1'
        last:
          type: string
          format: uri
          example: 'https://example.test/api/v1/records?page=1'
        prev:
          type:
            - string
            - 'null'
          format: uri
          example: null
        next:
          type:
            - string
            - 'null'
          format: uri
          example: null
      required:
        - first
        - last
        - prev
        - next
    PaginationLink:
      type: object
      properties:
        url:
          type:
            - string
            - 'null'
          format: uri
          example: 'https://example.test/api/v1/records?page=1'
        label:
          type: string
          example: '&laquo; Previous'
        page:
          type:
            - integer
            - 'null'
          example: null
        active:
          type: boolean
          example: false
      required:
        - label
        - page
        - active
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        from:
          type:
            - integer
            - 'null'
          example: 1
        last_page:
          type: integer
          example: 1
        path:
          type: string
          format: uri
          example: 'https://example.test/api/v1/records'
        per_page:
          type: integer
          example: 20
        to:
          type:
            - integer
            - 'null'
          example: 15
        total:
          type: integer
          example: 15
        links:
          type: array
          items:
            $ref: '#/components/schemas/PaginationLink'
          example:
            -
              url: null
              label: '&laquo; Previous'
              page: null
              active: false
            -
              url: 'https://example.test/api/v1/records?page=1'
              label: '1'
              page: 1
              active: true
            -
              url: null
              label: 'Next &raquo;'
              page: null
              active: false
      required:
        - current_page
        - from
        - last_page
        - path
        - per_page
        - to
        - total
        - links
    ProblemDetails:
      type: object
      description: 'Standard RFC 9457 problem details envelope.'
      properties:
        type:
          type: string
          format: uri
          example: 'about:blank'
        title:
          type: string
          example: Unauthorized
        status:
          type: integer
          example: 401
        detail:
          type:
            - string
            - 'null'
          example: 'Authentication failed'
        instance:
          type: string
          format: uri-reference
          example: /api/v1/me
        trace_id:
          type:
            - string
            - 'null'
          description: 'Unique identifier for the API request (if available).'
          example: b4f5aa7a-1470-4d92-8d3c-98e7c7de9f5f
      required:
        - type
        - title
        - status
        - instance
    ValidationProblemDetails:
      description: 'RFC 9457 compliant problem details response builder.'
      allOf:
        -
          $ref: '#/components/schemas/ProblemDetails'
        -
          type: object
          properties:
            errors:
              type: object
              description: 'Validation errors keyed by input field.'
              additionalProperties:
                type: array
                items:
                  type: string
              example:
                name:
                  - 'The name field is required.'
                expires_at:
                  - 'The expires at must be at least 24 hours from now.'
  securitySchemes:
    oauth2:
      type: oauth2
      description: "OAuth 2.0. A service integration uses the client credentials flow with a service client created in Administration, and its token acts as the client's API user. An application registered in Administration uses the authorization code flow with PKCE, and its token acts as the person who connected it, within the scopes they approved."
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            view-users: "View everyone's profiles and details."
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          refreshUrl: /oauth/token
          scopes:
            view-users: "View everyone's profiles and details."
    bearerToken:
      type: http
      description: 'A personal access token created on the Account page, or an access token from either OAuth flow, sent as a bearer token in the Authorization header.'
      scheme: bearer
tags:
  -
    name: Users
    description: 'Information about whoever the access token acts as: an API user for a service client, or the person for a personal access token or an application.'
